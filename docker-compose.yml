services:
  db:
    image: postgres:17-alpine
    container_name: btcfx-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-btcfx}
      POSTGRES_USER: ${POSTGRES_USER:-btcfx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-btcfx}
    ports:
      - '5433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-btcfx} -d ${POSTGRES_DB:-btcfx}']
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres-data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    container_name: btcfx-backend
    environment:
      APP_ENV: development
      API_V1_PREFIX: /api/v1
      FRONTEND_ORIGINS: http://localhost:3000
      POSTGRES_SERVER: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-btcfx}
      POSTGRES_USER: ${POSTGRES_USER:-btcfx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-btcfx}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me}
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
      SQLALCHEMY_ECHO: 'false'
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '8000:8000'
    volumes:
      - ./backend:/app

volumes:
  postgres-data: